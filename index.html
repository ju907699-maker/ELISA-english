<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英文傳說</title>
<meta name="description" content="英文傳說：遊戲化英文聽說讀寫、單字與文法，從國中英文練到全民英檢高級。">
<meta name="theme-color" content="#16204A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英文傳說">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=Spline+Sans+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — sticky header with player status, horizontal tab bar, one panel per tab, max 980px column */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#E8ECF6; --ink:#16204A; --muted:#5A6386;
  --line:#D3D9EA; --accent:#B7791F; --accent-ink:#FFFFFF; --royal:#2B3FA0;
  --good:#1D7A5C; --good-bg:#DDF3EA; --bad:#B23A3A; --bad-bg:#F8E1E1; --warn:#9A6A00; --warn-bg:#FBEFCF;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"Spline Sans Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1328; --surface:#171E3A; --surface-2:#212A4D; --ink:#E7EAF7; --muted:#9AA3C7;
  --line:#2E3860; --accent:#E3A93F; --accent-ink:#1A1405; --royal:#8EA2FF;
  --good:#5ED3A6; --good-bg:#123A2E; --bad:#FF8B8B; --bad-bg:#3E1A20; --warn:#F2C14E; --warn-bg:#3A2F10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1328; --surface:#171E3A; --surface-2:#212A4D; --ink:#E7EAF7; --muted:#9AA3C7;
  --line:#2E3860; --accent:#E3A93F; --accent-ink:#1A1405; --royal:#8EA2FF;
  --good:#5ED3A6; --good-bg:#123A2E; --bad:#FF8B8B; --bad-bg:#3E1A20; --warn:#F2C14E; --warn-bg:#3A2F10; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:1.45rem;font-weight:900;letter-spacing:.06em}
.brand small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.player{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.9rem;flex-wrap:wrap}
.lv{font-family:var(--f-mono);font-weight:600;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 8px}
.xpbar{width:120px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.streak{color:var(--accent);font-weight:700}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0 0;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;white-space:nowrap;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:24px 64px}
section.panel{display:grid;gap:20px;min-width:0}
section.panel>*,#adminBody>*{min-width:0}
#adminBody{display:grid;gap:16px}
.lead{color:var(--muted);max-width:65ch;margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.chip{display:inline-block;font-size:.78rem;border-radius:99px;padding:1px 10px;border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem}

/* map */
.road{display:grid;gap:0;position:relative}
.stage{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start;padding:14px 0;position:relative}
.stage:not(:last-child)::after{content:"";position:absolute;left:27px;top:62px;bottom:-6px;border-left:2px dashed var(--line)}
.seal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:1.3rem;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.stage.open .seal{border-color:var(--accent);color:var(--accent)}
.stage.current .seal{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stage .body{min-width:0}
.stage h3{font-size:1.1rem}
.stage .meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px;max-width:360px}
.prog i{display:block;height:100%;background:var(--royal)}
.skills4{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (max-width:640px){.skills4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.units{display:grid;gap:10px}
details.gcat{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:var(--surface)}
details.gcat summary{cursor:pointer;padding:4px 0}
details.gcat[open] summary{margin-bottom:8px}
.unit{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.unit b{font-family:var(--f-display)}
.unit .row{gap:6px}
.gcard{display:grid;gap:12px}
.gcard .pattern{font-family:var(--f-mono);font-size:.9rem;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.gcard .exs{display:grid;gap:8px}
.gcard .exs div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.gcard .tip{border-left:4px solid var(--accent);padding:6px 12px;background:var(--warn-bg);color:var(--ink);border-radius:0 8px 8px 0}
.blank{display:inline-block;min-width:3em;border-bottom:3px solid var(--accent);margin:0 .2em}
.toks{display:flex;flex-wrap:wrap;gap:6px}
.tok{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-weight:600;font-size:1.05rem}
.tok:hover:not([disabled]){border-color:var(--accent)}
.tok.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)} .tok.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.punct{align-self:center;font-weight:600;font-size:1.05rem}
.skillbtn{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;display:grid;gap:4px}
.skillbtn:hover{border-color:var(--accent)}
.skillbtn b{font-family:var(--f-display);font-size:1.15rem}
.skillbtn span{font-size:.82rem;color:var(--muted)}
.stagepick{display:flex;gap:6px;flex-wrap:wrap}
.stagepick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.85rem}
.stagepick button[disabled]{opacity:.4;cursor:not-allowed}
.stagepick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* game */
.game{display:grid;gap:16px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:99px;background:var(--surface-2)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--accent)}
.prompt{font-size:1.15rem;font-weight:500}
.en{font-family:var(--f-body);font-size:1.3rem;font-weight:700;letter-spacing:.01em}
.passage{background:var(--surface-2);border-radius:8px;padding:14px;line-height:1.75;max-width:70ch}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:1px dashed var(--line);border-radius:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:600}
.tile.used{opacity:.3}
.feedback{border-radius:8px;padding:12px 14px}
.feedback.ok{background:var(--good-bg);color:var(--good)} .feedback.no{background:var(--bad-bg);color:var(--bad)}
.feedback p{margin:4px 0 0;color:var(--ink)}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical}
.combo{font-family:var(--f-mono);color:var(--accent);font-weight:600}

/* achievements */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.badge{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.badge .gem{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;background:var(--surface-2);color:var(--muted)}
.badge.got .gem{background:var(--accent);color:var(--accent-ink)}
.badge:not(.got){opacity:.65}
.badge b{display:block}
.badge small{color:var(--muted);font-size:.8rem}

/* admin */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:.8rem}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.8rem;background:var(--surface-2)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.mini{display:inline-flex;align-items:center;gap:6px}
.mini i{display:inline-block;width:48px;height:6px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.mini i em{position:absolute;inset:0 auto 0 0;background:var(--royal)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.formgrid{grid-template-columns:1fr}}
.formgrid label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.formgrid .full{grid-column:1/-1}

/* plan doc */
.doc{max-width:72ch;display:grid;gap:14px}
.doc h2{font-size:1.35rem;margin-top:14px}
.doc h3{font-size:1.05rem;margin-top:6px}
.doc p,.doc li{line-height:1.8}
.doc ul,.doc ol{margin:0;padding-left:1.3em}
pre{background:var(--surface-2);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:.8rem;line-height:1.55;margin:0}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 16px;max-width:320px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast b{color:var(--accent)}
/* illustrations */
.hero-banner{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hero-banner .bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:500;display:inline-block;margin-bottom:6px}
.hero-banner .bubble::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
@media (max-width:520px){.hero-banner{grid-template-columns:1fr}.hero-banner .bubble::before{display:none}}
.login-grid{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
@media (max-width:520px){.login-grid{grid-template-columns:1fr}}
.seal{position:relative;border:0;background:none;width:56px;height:56px}
.seal svg{display:block}
.seal .num{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;font-weight:600;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.stage.open .seal .num{border-color:var(--accent);color:var(--accent)}
.stage.current .seal .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stage:not(.open) .seal svg{filter:grayscale(1);opacity:.45}
.skillbtn{grid-template-columns:auto 1fr;column-gap:10px;align-items:center}
.skillbtn svg{grid-row:span 3}
.skillbtn i{font-style:normal;font-size:.78rem;color:var(--accent);font-weight:700}
.guard-head{display:flex;align-items:center;gap:10px}
.guard-head .say{font-size:.85rem;color:var(--muted)}
.feedback.withpic{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg)}60%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#detail .chip,#dayBox .chip{white-space:normal;max-width:100%}
</style>
<style>header.top{top:0;padding-top:env(safe-area-inset-top,0px)} main{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><h1>英文傳說</h1><small>English Legend</small></div>
      <div class="player" aria-live="polite">
        <span id="pName" class="muted">冒險者</span>
        <span class="lv" id="pLv">Lv 1</span>
        <span class="xpbar" title="經驗值"><i id="pXpBar" style="width:0%"></i></span>
        <span class="muted" id="pXp">0 XP</span>
        <span class="streak" id="pStreak">連續 0 天</span>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="map" aria-selected="true">冒險地圖</button>
      <button role="tab" data-tab="play">闖關</button>
      <button role="tab" data-tab="ach">成就</button>
      <button role="tab" data-tab="admin" hidden>後台</button>
      <button role="tab" data-tab="plan" hidden>規劃書</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- LOGIN -->
  <section class="panel" id="tab-login" hidden>
    <div class="card login-grid" style="max-width:640px">
      <div class="bob" id="loginHero"></div>
      <div>
      <div class="eyebrow">學習者登入</div>
      <h2 style="font-size:1.5rem;margin-top:4px">歡迎來到英文傳說</h2>
      <p class="muted">請填寫你的姓名。姓名會作為你的學習紀錄登記名稱，老師在後台會用這個名字查看你的學習狀況。</p>
      <form id="loginForm" style="display:grid;gap:10px;margin-top:6px">
        <label for="loginName" style="font-weight:500">姓名（必填）</label>
        <input type="text" id="loginName" maxlength="20" autocomplete="name" placeholder="例如：王小明">
        <div class="row"><button class="btn primary" type="submit" id="loginBtn">登入開始冒險</button></div>
      </form>
      <p id="loginMsg" style="color:var(--bad);margin:10px 0 0"></p>
      <p class="muted" style="font-size:.85rem;margin:6px 0 0" id="loginNote"></p>
      </div>
    </div>
  </section>

  <!-- MAP -->
  <section class="panel" id="tab-map">
    <div class="hero-banner">
      <div class="bob" id="mapHero"></div>
      <div>
      <div class="bubble" id="mapSay">我是小傳！今天要跟哪一隻守護獸挑戰？</div>
      <h2 style="font-size:1.6rem">你的傳說之路</h2>
      <p class="lead">每一區都有單字、聽、說、讀、寫和文法小遊戲。答對累積經驗值，經驗值夠了就解鎖下一個區域。</p>
      </div>
    </div>
    <div id="dueBox"></div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><div class="eyebrow">選擇今天要練的技能</div><div class="muted" style="font-size:.88rem">每輪 5 題，約 2–4 分鐘</div></div>
        <div class="stagepick" id="stagePick" aria-label="選擇關卡"></div>
      </div>
      <div class="skills4" style="margin-top:14px" id="skillBtns"></div>
      <div id="aiRow" class="row" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <div class="eyebrow" style="margin-bottom:4px">區域地圖</div>
      <div class="road" id="road"></div>
      <label class="row muted" id="openAllBox" hidden style="font-size:.85rem;margin-top:8px"><input type="checkbox" id="openAll"> 試玩模式：開放所有區域（供規劃者預覽題目，不影響正式解鎖規則）</label>
    </div>
    <div class="card">
      <div class="eyebrow">目前學習者</div>
      <div class="row" style="margin-top:8px">
        <b id="curName" style="font-size:1.1rem"></b>
        <button class="btn" id="logout">切換學習者</button>
        <span class="muted" id="syncState" style="font-size:.85rem"></span>
      </div>
    </div>
  </section>

  <!-- PLAY -->
  <section class="panel" id="tab-play" hidden>
    <div id="game" class="card game"></div>
    <div id="essay" class="card" hidden></div>
  </section>

  <!-- ACHIEVEMENTS -->
  <section class="panel" id="tab-ach" hidden>
    <div><h2 style="font-size:1.6rem">成就徽章</h2><p class="lead">徽章記錄你走過的每一步。已取得的徽章會亮起來。</p></div>
    <div class="kpis" id="myStats"></div>
    <div class="card" id="masteryBox"></div>
    <div class="ach" id="achList"></div>
  </section>

  <!-- ADMIN -->
  <section class="panel" id="tab-admin" hidden>
    <div><h2 style="font-size:1.6rem">學習狀況後台</h2><p class="lead" id="adminLead">管理者可以在這裡看到每位學習者的進度、四項技能正確率、最後上線時間，並且新增題目。</p></div>

function loadScript(u){ return new Promise((ok,no)=>{ const t=document.createElement("script"); t.src=u; t.onload=ok; t.onerror=no; document.head.appendChild(t); }); }
async function initFirebase(cfg){
  const base="https://www.gstatic.com/firebasejs/"+FB_VER+"/";
  await loadScript(base+"firebase-app-compat.js");
  await Promise.all([loadScript(base+"firebase-auth-compat.js"), loadScript(base+"firebase-firestore-compat.js")]);
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  const auth=firebase.auth(), fs=firebase.firestore();
  try{ fs.settings({ignoreUndefinedProperties:true, merge:true}); }catch(e){}
  let u=await new Promise(r=>{ const off=auth.onAuthStateChanged(x=>{ off(); r(x); }); });
  if(!u){ u=(await auth.signInAnonymously()).user; }
  let admin=false;
  if(!u.isAnonymous){ try{ admin=(await fs.doc("admins/"+u.uid).get()).exists; }catch(e){} }
  return {db:fs, uid:u.uid, isAdmin:admin, email:u.email||"", anonymous:u.isAnonymous};
}

function canSee(tab){ if(tab==="admin") return isAdmin||(APP_MODE!=="claude"&&ADMIN_ROUTE); if(tab==="plan") return isAdmin||(APP_MODE==="local"&&ADMIN_ROUTE&&!CLOUD_SET); return true; }
function applyRole(){ ["admin","plan"].forEach(t=>{ const b=document.querySelector('#tabs [data-tab="'+t+'"]'); if(b) b.hidden=!canSee(t); }); const o=document.getElementById("openAllBox"); if(o) o.hidden=!(isAdmin||(APP_MODE==="local"&&ADMIN_ROUTE&&!CLOUD_SET)); if(!o||o.hidden){ openAll=false; const c=document.getElementById("openAll"); if(c) c.checked=false; } }

// 本機紀錄以姓名登記：english-legend-record:<姓名>
const LS_CUR="english-legend-current", LS_PFX="english-legend-record:";
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function loadLocalRecord(name){ let r=freshProfile(); try{ const raw=lsGet(LS_PFX+name); if(raw) r=Object.assign(freshProfile(),JSON.parse(raw)); }catch(e){} r.name=name; return r; }
function cleanName(v){ return String(v||"").replace(/\s+/g," ").trim().slice(0,20); }
{ const cur=cleanName(lsGet(LS_CUR)); if(cur) P=loadLocalRecord(cur); }

function bank(){ return BUILTIN.concat(GRAM_QS, VOCAB_ITEMS, bankExtra); }
function normP(p){ Object.keys(SKILLS).forEach(k=>{ if(!p.skills[k]) p.skills[k]={a:0,c:0,r:0}; }); if(!p.gram) p.gram={}; if(!p.cards) p.cards={}; return p; }
function level(xp){ return 1+Math.floor(xp/120); }
function unlocked(n){ if(openAll||n===1) return true; return (P.stageXP[n-1]||0) >= STAGES[n-1].unlock; }
function highestUnlocked(){ let h=1; for(let n=2;n<=5;n++){ if((P.stageXP[n-1]||0)>=STAGES[n-1].unlock) h=n; else break; } return h; }

function saveLocal(){ if(!P.name) return; lsSet(LS_PFX+P.name, JSON.stringify(P)); lsSet(LS_CUR, P.name); }
async function saveRemote(){
  if(!P.name) return;
  saveLocal();
  if(!db||!uid){ setSync(); return; }
  try{
    const days=Object.keys(P.daily).sort().slice(-30); const daily={}; days.forEach(d=>daily[d]=P.daily[d]);
    P.daily=daily; trimLog(P);
    const wrongTop=Object.entries(P.wrong).sort((a,b)=>b[1]-a[1]).slice(0,30); P.wrong=Object.fromEntries(wrongTop);
    await db.doc("learners/"+uid).set(Object.assign({},P,{stage:highestUnlocked(),updatedAt:Date.now()}));
    setSync("已同步到雲端");
  }catch(e){ setSync("雲端同步失敗，進度先存在這台裝置"); }
}
function setSync(t){ const el=document.getElementById("syncState"); if(t){el.textContent=t;return;} el.textContent = db&&uid ? "學習紀錄以此姓名登記，並同步給後台" : "目前只存在這台裝置（未登入或無雲端權限）"; }

/* ============ 共用 UI ============ */
const $ = s=>document.querySelector(s);
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let toastTimer;
function toast(html){ const t=$("#toast"); t.innerHTML=html; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,3500); }
function showTab(name){
  if(!canSee(name)) name="map";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===name?"true":"false"));
  const needLogin = !P.name && ["map","play","ach"].includes(name);
  ["map","play","ach","admin","plan"].forEach(t=>document.getElementById("tab-"+t).hidden = needLogin || t!==name);
  document.getElementById("tab-login").hidden = !needLogin;
  if(needLogin){ renderLoginNote(); setTimeout(()=>{ const i=document.getElementById("loginName"); if(i) i.focus(); },50); return; }
  if(name==="map") renderMap();
  if(name==="ach") renderAch();
  if(name==="admin") renderAdmin();
  if(name==="play" && !round) renderPlayIdle();
  window.scrollTo({top:0});
}
document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) showTab(b.dataset.tab); });

function renderHeader(){
  normP(P);
  const lv=level(P.xp), into=P.xp%120;
  $("#pLv").textContent="Lv "+lv; $("#pXp").textContent=P.xp+" XP";
  $("#pXpBar").style.width=(into/120*100)+"%";
  $("#pStreak").textContent="連續 "+(P.lastDay===today()||P.lastDay===yesterday()?P.streak:0)+" 天";
  $("#pName").textContent=P.name||"尚未登入";
}

/* ============ 地圖 ============ */
function renderMap(){
  const h=highestUnlocked();
  if(!unlocked(curStage)) curStage=1;
  $("#stagePick").innerHTML = STAGES.map(s=>`<button aria-pressed="${s.n===curStage}" ${unlocked(s.n)?"":"disabled"} data-st="${s.n}">${s.n}. ${s.name}</button>`).join("");
  $("#skillBtns").innerHTML = Object.entries(SKILLS).map(([k,v])=>{ const sk=P.skills[k]; const acc=sk.a?Math.round(sk.c/sk.a*100)+"%":"—";
    let mline, pct, good=false;
    if(k==="V"){ const pr=progressOf(VOCAB.filter(v=>v.stage===curStage).map(v=>({id:v.id}))); mline=pr.n?`第 ${curStage} 區：練過 ${pr.practiced}/${pr.n} 個主題，精熟 ${pr.mastered}`:`第 ${curStage} 區沒有單字主題`; pct=pr.pct; good=pr.n&&pr.mastered===pr.n; }
    else if(k==="G"){ const pr=progressOf(GRAMMAR.filter(u=>unlocked(u.stage))); mline=`練過 ${pr.practiced} 項，精熟 ${pr.mastered}/${pr.n} 項`; pct=pr.pct; }
    else { const m=mastery(P.gram[k+"-"+curStage]); mline=`第 ${curStage} 區：${m.label}（近 ${m.n} 題對 ${m.ok}）`; pct=m.ok*10; good=m.lv===3; }
    return `<button class="skillbtn" data-sk="${k}">${guardSVG(k,"happy",60)}<b>${v.name}</b><span><i>${GUARD[k].name}</i>｜正確率 ${acc}</span><span>${mline}<span class="prog" style="display:block;margin-top:4px"><i style="width:${pct}%;${good?"background:var(--good)":""}"></i></span></span></button>`; }).join("");
  const due=dueUnits();
  $("#dueBox").innerHTML = due.length ? `<div class="card" style="border-color:var(--accent)"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">今日複習</div><b>${due.length} 個單元到期了</b></div><button class="btn primary" data-act="mixreview">開始今日複習</button></div>
     <div class="row" style="margin-top:8px">${due.slice(0,12).map(u=>`<span class="chip">${esc(u.title)}</span>`).join("")}${due.length>12?`<span class="muted">…等 ${due.length} 個</span>`:""}</div></div>` : "";
  $("#aiRow").innerHTML = sample ? `<span class="muted" style="font-size:.85rem">AI 新題（第 ${curStage} 區，未經教師審稿）：</span>${["L","S","R","W"].map(k=>`<button class="btn ghost" data-aisk="${k}">${SKILLS[k].name}</button>`).join("")}` : "";
  $("#road").innerHTML = STAGES.map(s=>{
    const open=unlocked(s.n), cur=s.n===h; const nx=STAGES[s.n]; const sx=P.stageXP[s.n]||0;
    const pct = nx? Math.min(100, sx/nx.unlock*100) : Math.min(100,sx/300*100);
    const note = nx ? (sx>=nx.unlock?`已達解鎖下一區門檻`:`本區再得 ${nx.unlock-sx} XP 解鎖「${nx.name}」`) : `最終區域：繼續累積經驗值`;
    return `<div class="stage ${open?"open":""} ${cur?"current":""}"><div class="seal">${regionSVG(s.n,56)}<span class="num">${s.n}</span></div><div class="body">
      <h3>${s.name}</h3>
      ${open?`<div class="prog"><i style="width:${pct}%"></i></div><div class="muted" style="font-size:.82rem">${sx} XP｜${note}</div>`:`<div class="muted" style="font-size:.85rem">尚未解鎖</div>`}
    </div></div>`; }).join("");
  $("#curName").textContent=P.name||"";
  setSync();
}
$("#stagePick").addEventListener("click",e=>{ const b=e.target.closest("button[data-st]"); if(!b||b.disabled) return; curStage=+b.dataset.st; renderMap(); });
$("#skillBtns").addEventListener("click",e=>{ const b=e.target.closest("[data-sk]"); if(b) startRound(b.dataset.sk); });
$("#dueBox").addEventListener("click",e=>{ if(e.target.closest("[data-act=mixreview]")) startMixedReview(); });
$("#aiRow").addEventListener("click",e=>{ const b=e.target.closest("[data-aisk]"); if(b) startAISkill(b.dataset.aisk); });
$("#openAll").addEventListener("change",e=>{ openAll=e.target.checked; renderMap(); });
$("#logout").addEventListener("click",()=>{ P=freshProfile(); round=null; lsSet(LS_CUR,""); renderHeader(); showTab("map"); });

/* ============ 登入（姓名必填） ============ */
let pendingRename=null;
function loginMsg(t){ $("#loginMsg").textContent=t||""; }
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const name=cleanName($("#loginName").value);
  if(!name){ loginMsg("請填寫姓名才能開始。"); return; }
  $("#loginBtn").disabled=true;
  try{
    if(db&&uid){
      let remote=null; try{ const s=await db.doc("learners/"+uid).get(); if(s.exists) remote=s.data(); }catch(err){}
      const old=remote&&(remote.name||remote.nickname);
      if(old && old!==name && pendingRename!==name){
        pendingRename=name;
        loginMsg(`這個帳號的學習紀錄已登記為「${old}」。若要改登記為「${name}」並保留原本進度，請再按一次「登入開始冒險」。`);
        return;
      }
      P=Object.assign(freshProfile(), remote||loadLocalRecord(name)); P.name=name; delete P.nickname;
    } else {
      P=loadLocalRecord(name);
    }
    pendingRename=null; loginMsg(""); $("#loginName").value="";
    await saveRemote(); renderHeader(); showTab("map"); toast(`歡迎，${esc(name)}！學習紀錄已用這個姓名登記。`);
  } finally { $("#loginBtn").disabled=false; }
});
function renderLoginNote(){
  $("#loginNote").textContent = db&&uid
    ? "你的學習紀錄會同步給後台。同一個帳號只登記一份學習紀錄。"
    : "目前沒有連上雲端，學習紀錄只會存在這台裝置；同一台裝置可以用不同姓名分別登記。";
}

/* ============ 語音 ============ */
function speak(text, rate){
  try{ if(!("speechSynthesis" in window)){ toast("這個瀏覽器不支援語音播放"); return; }
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=rate||0.9;
    const v=speechSynthesis.getVoices().find(v=>/^en(-|_)US/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u);
  }catch(e){ toast("語音播放失敗"); }
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function norm(s){ return String(s).toLowerCase().replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim(); }
function wordMatch(target, heard){ const t=norm(target).split(" "), h=new Set(norm(heard).split(" ")); const hit=t.filter(w=>h.has(w)).length; return hit/t.length; }

/* ============ 闖關引擎 ============ */
let round=null;
function pickQuestions(skill, stage){
  const pool = bank().filter(q=>q.skill===skill);
  let qs = pool.filter(q=>q.stage===stage);
  // 本區題目不足 5 題時，用較低區域題目補足
  for(let s=stage-1; qs.length<5 && s>=1; s--){ qs=qs.concat(shuffle(pool.filter(q=>q.stage===s)).slice(0,5-qs.length)); }
  // 常錯題優先複習
  qs = shuffle(qs).sort((a,b)=>(P.wrong[b.id]||0)-(P.wrong[a.id]||0));
  return qs.slice(0,5).map(q=>Object.assign({},q,{unit:q.skill+"-"+q.stage}));
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startRound(skill){
  if(skill==="G"){ renderGrammarHall(); return; }
  if(skill==="V"){ renderVocabHall(); return; }
  const qs=pickQuestions(skill,curStage);
  if(!qs.length){ toast("這個區域還沒有題目，請到後台新增"); return; }
  round={skill, stage:curStage, qs, i:0, results:[], combo:0, gained:0, start:Date.now(), answered:false};
  showTab("play"); renderQ();
}
function renderPlayIdle(){
  $("#game").innerHTML=`<div class="eyebrow">闖關</div><h2>選一項技能開始</h2><p class="muted">回到冒險地圖選擇區域與技能，或直接從這裡開始目前區域（${STAGES[curStage-1].name}）。</p>
  <div class="skills4">${Object.entries(SKILLS).map(([k,v])=>`<button class="skillbtn" data-sk="${k}">${guardSVG(k,"happy",60)}<b>${v.name}</b><span><i>${GUARD[k].name}</i></span><span>${v.desc}</span></button>`).join("")}</div>`;
  $("#game").querySelector(".skills4").addEventListener("click",e=>{ const b=e.target.closest("[data-sk]"); if(b) startRound(b.dataset.sk); });
  renderEssayCard();
}
function dots(){ return `<div class="dots">${round.qs.map((q,i)=>`<i class="${i<round.results.length?(round.results[i]?"ok":"no"):(i===round.i?"now":"")}"></i>`).join("")}</div>`; }

function renderQ(){
  const q=round.qs[round.i]; round.answered=false; $("#essay").hidden=true;
  const st=STAGES[q.stage-1];
  let body="";
  if(q.type==="listen_choice"){
    body=`<div class="row"><button class="btn primary" data-act="play">▶ 播放</button><button class="btn" data-act="slow">慢速再聽</button></div>
      <div class="prompt">${esc(q.prompt)}</div>
      <div class="opts">${q.options.map((o,i)=>`<button class="opt" data-opt="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>`;
  } else if(q.type==="read_choice"){
    body=`<div class="passage">${esc(q.passage)}</div><div class="prompt">${esc(q.prompt)}</div>
      <div class="opts">${q.options.map((o,i)=>`<button class="opt" data-opt="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>`;
  } else if(q.type==="shadow"){
    body=`<div class="en">${esc(q.audio)}</div><div class="muted">${esc(q.prompt)}</div>
      <div class="row"><button class="btn" data-act="play">▶ 聽示範</button>
      ${SR?`<button class="btn primary" data-act="rec">● 開始跟讀</button>`:""}</div>
      <div id="srOut" class="muted" style="font-size:.9rem">${SR?"按「開始跟讀」後大聲念出句子，系統會比對你說出的字。若瀏覽器不允許使用麥克風，可改用下方自評。":"這個環境不能使用麥克風辨識，請聽示範後跟讀，再如實自評。"}</div>
      <div class="row"><span class="muted" style="font-size:.88rem">自評：</span><button class="btn" data-self="1">我念得清楚流暢</button><button class="btn ghost" data-self="0">還需要多練</button></div>`;
  } else if(q.type==="build"){
    const words=q.answer.split(" ");
    round.tiles=shuffle(words.map((w,i)=>({w,i}))); round.built=[];
    body=`<div class="prompt">請把字卡排成正確的英文句子：</div><div class="en" style="font-size:1.1rem">${esc(q.prompt)}</div>
      <div class="tiles" id="built" aria-label="你的句子"></div>
      <div class="tiles" id="pool" style="border-style:solid">${round.tiles.map((t,k)=>`<button class="tile" data-tile="${k}">${esc(t.w)}</button>`).join("")}</div>
      <div class="row"><button class="btn" data-act="undo">退回一張</button><button class="btn primary" data-act="check">確認</button></div>`;
  } else if(q.type==="mc"){
    body=`<div class="prompt">${esc(q.lead||"")}</div><div class="en">${esc(q.prompt)}</div>
      <div class="opts">${q.options.map((o,i)=>`<button class="opt" data-opt="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>`;
  } else if(q.type==="gram_choice"){
    body=`<div class="prompt">${esc(q.lead||"選出正確的答案：")}</div><div class="en">${esc(q.prompt).replace("___",'<span class="blank">　</span>')}</div>
      <div class="opts">${q.options.map((o,i)=>`<button class="opt" data-opt="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>`;
  } else if(q.type==="gram_fix"){
    body=`<div class="prompt">找錯字：這句話有一個地方錯了，點出錯誤的字。</div>
      <div class="toks">${q.prompt.split(" ").map((t,i)=>/^[.,?!]$/.test(t)?`<span class="punct">${esc(t)}</span>`:`<button class="tok" data-tok="${i}">${esc(t)}</button>`).join("")}</div>`;
  } else if(q.type==="spell"){
    body=`<div class="row"><button class="btn primary" data-act="play">▶ 播放</button><span class="muted">中文提示：${esc(q.prompt)}</span></div>
      <input type="text" id="spellIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入你聽到的單字">
      <div class="row"><button class="btn primary" data-act="check">確認</button></div>`;
  }
  $("#game").innerHTML=`<div class="ghead"><div class="guard-head">${guardSVG(q.skill,"happy",52)}<div><div class="eyebrow">${SKILLS[q.skill].name}｜第 ${q.stage} 區 ${st.name}</div><h2 style="font-size:1.2rem">第 ${round.i+1} / ${round.qs.length} 題</h2>${round.i===0?`<div class="say">${GUARD[q.skill].name}：「${GUARD[q.skill].line}」</div>`:""}</div></div>
    <div class="row">${round.combo>=2?`<span class="combo">${round.combo} 連擊</span>`:""}${dots()}</div></div>
    ${body}<div id="fb"></div>`;
  if(q.type==="listen_choice"||q.type==="spell") setTimeout(()=>speak(q.audio),250);
  const sp=$("#spellIn"); if(sp){ sp.focus(); sp.addEventListener("keydown",e=>{ if(e.key==="Enter") check(); }); }
}
$("#game").addEventListener("click",e=>{
  if(!round) return; const q=round.qs?round.qs[round.i]:null;
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.act==="play") speak(q.audio);
  if(b.dataset.act==="slow") speak(q.audio,0.65);
  if(b.dataset.act==="next") nextQ();
  if(b.dataset.act==="vhall"){ round=null; renderVocabHall(); return; }
  if(b.dataset.act==="vcard"){ showWordCard(b.dataset.unit); return; }
  if(b.dataset.act==="vstart"){ startVocab(b.dataset.unit); return; }
  if(b.dataset.act==="vsay"){ speak(b.dataset.w); return; }
  if(b.dataset.act==="again"&&round.skill==="MIX"){ startMixedReview(); return; }
  if(b.dataset.act==="again"&&round.skill==="V"){ startVocab(round.unit); return; }
  if(b.dataset.act==="again"&&round.ai&&round.skill!=="G"){ startAISkill(round.skill); return; }
  if(b.dataset.act==="again"){ if(round.review) startReview(); else if(round.ai) startAI(round.unit); else if(round.unit) startGrammar(round.unit); else startRound(round.skill); return; }
  if(b.dataset.act==="hall"){ round=null; renderGrammarHall(); return; }
  if(b.dataset.act==="review"){ startReview(); return; }
  if(b.dataset.act==="mixreview"){ startMixedReview(); return; }
  if(b.dataset.act==="aigen"){ startAI(b.dataset.unit); return; }
  if(b.dataset.act==="say"&&round.card){ speak(round.card.ex[+b.dataset.i][0]); return; }
  if(b.dataset.act==="card"){ showCard(b.dataset.unit); return; }
  if(b.dataset.act==="gostart"){ startGrammar(b.dataset.unit); return; }
  if(b.dataset.act==="map"){ round=null; showTab("map"); return; }
  if(b.dataset.act==="again"||b.dataset.act==="next") return;
  if(round.answered) return;
  if(b.dataset.opt!=null){ const i=+b.dataset.opt; const ok=i===q.answer;
    document.querySelectorAll(".opt").forEach((o,k)=>{ o.disabled=true; if(k===q.answer) o.classList.add("ok"); else if(k===i) o.classList.add("no"); });
    answer(ok); }
  if(b.dataset.tok!=null){ const i=+b.dataset.tok; const w=[].concat(q.wrong); const ok=w.includes(i);
    document.querySelectorAll(".tok").forEach(t=>{ const k=+t.dataset.tok; t.disabled=true; if(w.includes(k)) t.classList.add("ok"); else if(k===i) t.classList.add("no"); });
    answer(ok); }
  if(b.dataset.tile!=null){ const k=+b.dataset.tile; if(round.built.includes(k)) return; round.built.push(k); b.classList.add("used"); drawBuilt(); }
  if(b.dataset.act==="undo"){ const k=round.built.pop(); if(k!=null){ document.querySelector(`[data-tile="${k}"]`).classList.remove("used"); drawBuilt(); } }
  if(b.dataset.act==="check") check();
  if(b.dataset.self!=null) answer(b.dataset.self==="1", "（自評）");
  if(b.dataset.act==="rec") recognize(q);
});
function drawBuilt(){ $("#built").innerHTML=round.built.map(k=>`<span class="tile">${esc(round.tiles[k].w)}</span>`).join(""); }
function check(){
  const q=round.qs[round.i]; if(round.answered) return;
  if(q.type==="build"){ if(round.built.length<round.tiles.length){ toast("還有字卡沒有放進句子"); return; }
    const s=round.built.map(k=>round.tiles[k].w).join(" "); answer(s===q.answer); }
  if(q.type==="spell"){ const v=$("#spellIn").value.trim().toLowerCase(); if(!v){ toast("請先輸入單字"); return; } answer(v===q.answer.toLowerCase()); }
}
function recognize(q){
  try{
    const r=new SR(); r.lang="en-US"; r.interimResults=false; r.maxAlternatives=1;
    $("#srOut").textContent="正在聆聽…請念出句子";
    r.onresult=ev=>{ const heard=ev.results[0][0].transcript; const score=wordMatch(q.audio,heard);
      $("#srOut").innerHTML=`系統聽到：「${esc(heard)}」｜字詞吻合 ${Math.round(score*100)}%`; answer(score>=0.8, `（辨識吻合 ${Math.round(score*100)}%）`); };
    r.onerror=()=>{ $("#srOut").textContent="無法使用麥克風或沒有聽到聲音，請改用下方自評。"; };
    r.start();
  }catch(e){ $("#srOut").textContent="這個環境無法啟動語音辨識，請改用下方自評。"; }
}
function answer(ok, note){
  const q=round.qs[round.i]; round.answered=true; round.results.push(ok);
  const sk=P.skills[q.skill]; sk.a++; if(ok) sk.c++;
  let gain=0;
  if(ok){ round.combo++; gain=10+(round.combo>=3?5:0); P.bestCombo=Math.max(P.bestCombo,round.combo); if(!q.ai&&P.wrong[q.id]){ P.wrong[q.id]--; if(P.wrong[q.id]<=0) delete P.wrong[q.id]; } }
  else { round.combo=0; if(!q.ai) P.wrong[q.id]=(P.wrong[q.id]||0)+1; }
  round.gained+=gain; P.xp+=gain; P.stageXP[round.stage]=(P.stageXP[round.stage]||0)+gain;
  const d=today(); P.daily[d]=(P.daily[d]||0)+1;
  logAnswer(q, ok, d);
  if(P.lastDay!==d){ P.streak = P.lastDay===yesterday()? P.streak+1 : 1; P.lastDay=d; }
  P.lastActive=Date.now();
  if(q.unit){ const gu=gUnit(q.unit), before=mastery(gu).lv; gu.a++; if(ok) gu.c++; gu.hist=(gu.hist||[]).concat({o:ok?1:0,d:today()}).slice(-10);
    if(before<3&&mastery(gu).lv===3){ gu.masteredAt=Date.now(); const un=unitById(q.unit); setTimeout(()=>toast(`<b>${esc(un?un.title:q.unit)}</b> 達到精熟！`),600); } }
  const right = q.type==="gram_fix" ? `錯誤的地方：「${esc([].concat(q.wrong).map(i=>q.prompt.split(" ")[i]).join(" "))}」→ ${esc(q.fix)}` : q.type==="build"||q.type==="spell" ? `正確答案：${esc(q.answer)}` : q.type==="shadow" ? "" : `正確答案：${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}`;
  $("#fb").innerHTML=`<div class="feedback withpic ${ok?"ok":"no"}"><div class="pop">${ok?heroSVG("cheer",58):guardSVG(q.skill,"sad",58)}</div><div><b>${ok?(round.combo>=3?round.combo+" 連擊！":"答對了！")+" +"+gain+" XP":"再接再厲，"+GUARD[q.skill].name+"等你再挑戰"}</b> ${note||""}
    ${right?`<p>${right}</p>`:""}${q.explain?`<p>${esc(q.explain)}</p>`:""}</div></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="next">${round.i+1<round.qs.length?"下一題":"看結果"}</button></div>`;
  document.querySelectorAll("[data-self],[data-act=rec],[data-act=check],[data-act=undo]").forEach(x=>x.disabled=true);
  document.querySelector(".dots").outerHTML=dots();
  checkAch(); renderHeader(); saveLocal();
}
// 每日學習紀錄：P.log[日期] = {sec 學習秒數, n 題數, ok 答對, u:{單元ID:[題數,答對]}}
// 學習時間以作答間隔累計，每題最多算 3 分鐘，避免離開畫面時一直計時
const LOG_CAP_SEC=180, LOG_KEEP_DAYS=60;
function logAnswer(q, ok, d){
  if(!P.log) P.log={};
  const day=P.log[d]||(P.log[d]={sec:0,n:0,ok:0,u:{}});
  const now=Date.now(), since=round.lastAt||round.start||now;
  day.sec=Math.round(day.sec+Math.min(Math.max(0,(now-since)/1000),LOG_CAP_SEC)); round.lastAt=now;
  day.n++; if(ok) day.ok++;
  const key=q.unit||(q.skill+"-"+q.stage), e=day.u[key]||(day.u[key]=[0,0]); e[0]++; if(ok) e[1]++;
}
function trimLog(p){ if(!p.log) return; const keep=Object.keys(p.log).sort().slice(-LOG_KEEP_DAYS); const o={}; keep.forEach(k=>o[k]=p.log[k]); p.log=o; }
function fmtDur(sec){ sec=Math.round(sec||0); if(!sec) return "0 分"; const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s2=sec%60; return h? `${h} 小時 ${m} 分` : m? `${m} 分 ${s2} 秒` : `${s2} 秒`; }
function unitLabel(key){ const u=unitById(key); if(u) return {skill:u.skill, title:u.skill==="V"||u.skill==="G"? u.title.replace(/^單字｜/,"") : STAGES[u.stage-1].name}; const k=String(key).split("-")[0]; return {skill:SKILLS[k]?k:"", title:key}; }
function dayContentHTML(day){
  const by={}; Object.entries(day.u||{}).forEach(([key,[n,ok]])=>{ const lb=unitLabel(key); (by[lb.skill]=by[lb.skill]||[]).push(`${esc(lb.title)} ${ok}/${n}`); });
  return Object.keys(SKILLS).filter(k=>by[k]).map(k=>`<div><b>${SKILLS[k].name}</b>：<span class="muted">${by[k].join("、")}</span></div>`).join("") || `<span class="muted">—</span>`;
}
function nextQ(){ round.i++; if(round.i<round.qs.length) renderQ(); else finishRound(); }

/* ============ 文法館 ============ */
const SR_DAYS=[1,1,2,4,7,14];
function addDays(n){ const d=new Date(Date.now()+n*864e5); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function gUnit(id){ const g=P.gram[id]||(P.gram[id]={a:0,c:0}); if(!g.hist) g.hist=[]; if(g.box==null) g.box=0; return g; }
// 練習進度：每個單元以「最近 10 題答對數」累積，精熟算滿分；有練習就至少顯示一小段，讓學習者看得到進度
function progressOf(units){ const n=units.length; if(!n) return {n:0,practiced:0,mastered:0,pct:0};
  let pts=0, practiced=0, mastered=0;
  units.forEach(u=>{ const g=P.gram[u.id], m=mastery(g); if(m.lv) practiced++; if(m.lv===3){ mastered++; pts+=10; } else pts+=Math.min(m.ok,10); });
  const raw=pts/(10*n)*100; return {n,practiced,mastered,pct: practiced? Math.max(raw,3) : 0}; }
function mastery(g){
  if(!g||!g.a) return {lv:0,label:"未開始",cls:"",n:0,ok:0};
  const h=(g.hist||[]).slice(-10), ok=h.filter(x=>x.o).length, days=new Set(h.map(x=>x.d)).size;
  if(h.length>=10&&ok>=9&&days>=2) return {lv:3,label:"精熟",cls:"good",n:h.length,ok};
  if(h.length>=5&&ok/h.length>=0.8) return {lv:2,label:"接近精熟",cls:"warn",n:h.length,ok};
  return {lv:1,label:"學習中",cls:"",n:h.length,ok};
}
const SKILLUNITS = ["L","S","R","W"].flatMap(k=>STAGES.map(s=>({id:k+"-"+s.n, skill:k, stage:s.n, title:SKILLS[k].name+"｜"+s.name})));
let _allUnits=null;
function allUnits(){ return _allUnits||(_allUnits=VOCAB.map(v=>({id:v.id,skill:"V",stage:v.stage,title:"單字｜"+v.title})).concat(SKILLUNITS, GRAMMAR.map(u=>({id:u.id,skill:"G",stage:u.stage,title:u.title})))); }
function unitById(id){ return allUnits().find(u=>u.id===id); }
function dueUnits(skill){ const t=today(); return allUnits().filter(u=>(!skill||u.skill===skill)&&unlocked(u.stage)&&P.gram[u.id]&&P.gram[u.id].a&&P.gram[u.id].due&&P.gram[u.id].due<=t); }
function unitTotal(skill){ return allUnits().filter(u=>!skill||u.skill===skill).length; }
function masteredCount(l, skill){ return allUnits().filter(u=>(!skill||u.skill===skill)&&mastery((l.gram||{})[u.id]).lv===3).length; }
function unitStat(id){ const u=(P.gram||{})[id]; return u&&u.a? Math.round(u.c/u.a*100) : null; }

   ${lv}
   ${sample?`<p class="muted" style="font-size:.85rem">「AI 新題」為 AI 即時出題，未經老師審稿。</p>`:""}`;

function startGrammar(id){
  const u=GRAMMAR.find(x=>x.id===id); if(!u) return;
  const pool=GRAM_QS.filter(q=>q.unit===id);
  if(!pool.length){ if(sample) startAI(id); else toast("這項技能的題目還在準備中"); return; }
  const qs=shuffle(pool).sort((a,b)=>(P.wrong[b.id]||0)-(P.wrong[a.id]||0)).slice(0,5);
  round={skill:"G", unit:id, stage:u.stage, qs, i:0, results:[], combo:0, gained:0, start:Date.now(), answered:false};
  showTab("play"); renderQ();
}
function startReview(){
  const due=dueUnits("G").filter(u=>GRAM_QS.some(q=>q.unit===u.id)); if(!due.length){ renderGrammarHall(); return; }
  let qs=[]; due.forEach(u=>{ const pool=shuffle(GRAM_QS.filter(q=>q.unit===u.id)).sort((a,b)=>(P.wrong[b.id]||0)-(P.wrong[a.id]||0)); qs=qs.concat(pool.slice(0, due.length>=5?1:Math.ceil(5/due.length))); });
  qs=shuffle(qs).slice(0,Math.max(5,due.length));
  round={skill:"G", review:true, stage:Math.max(...due.map(u=>u.stage)), qs, i:0, results:[], combo:0, gained:0, start:Date.now(), answered:false};
  showTab("play"); renderQ();
}
async function startAI(id){
  const u=GRAMMAR.find(x=>x.id===id); if(!u||!sample) return;
  $("#game").innerHTML=`<div class="guard-head">${guardSVG("G","happy",56)}<div><div class="eyebrow">AI 新題｜${esc(u.title)}</div><h2 style="font-size:1.2rem">格格龜正在出題…</h2><div class="say">第一次使用會詢問是否允許。</div></div></div>`;

  try{
    const used=GRAM_QS.filter(q=>q.unit===id).map(q=>q.prompt).concat(GDIAG.filter(d=>d.sid===id).map(d=>d.stem)).join(" | ");
    const r=await sample.json(`Create 5 NEW English grammar practice items for Taiwanese secondary-school learners on this grammar point: "${u.title}".
Category: ${u.cat}. Curriculum item: ${u.official||u.title}.
${u.card?`Rule (Traditional Chinese): ${u.card.rule}\nPattern: ${u.card.pattern}`:""}
Target level: ${u.src==="主檔"?"Taiwan junior high school (108 curriculum), "+u.level:STAGES[u.stage-1].meta}
Make 3 items of type "c" (fill in the blank, sentence contains ___ exactly once, 3 options, exactly one correct) and 2 items of type "f" (find the error: a sentence whose tokens are separated by single spaces, punctuation as separate tokens, containing exactly one wrong word; "wrong" is the 0-based index of that token).
Use everyday contexts suitable for teenagers. Do not reuse these sentences: ${used}
Return JSON only: {"items":[{"type":"c","sentence":"...","options":["...","...","..."],"answer":0,"explain":"繁體中文解析"},{"type":"f","sentence":"...","wrong":2,"fix":"correct form","explain":"繁體中文解析"}]}`, {modelTier:"quick"});
    const items=(r&&Array.isArray(r.items)?r.items:[]).map((it,k)=>{
      const base={id:"AI-"+id+"-"+Date.now()+"-"+k, ai:true, skill:"G", stage:u.stage, unit:id, explain:String(it.explain||""), tags:[u.title]};
      if(it.type==="c" && typeof it.sentence==="string" && it.sentence.includes("___") && Array.isArray(it.options) && it.options.length>=2 && it.options.length<=4 && Number.isInteger(it.answer) && it.answer>=0 && it.answer<it.options.length)
        return Object.assign(base,{type:"gram_choice",prompt:it.sentence,options:it.options.map(String),answer:it.answer});
      if(it.type==="f" && typeof it.sentence==="string" && Number.isInteger(it.wrong)){ const t=it.sentence.split(" "); if(t[it.wrong] && !/^[.,?!]$/.test(t[it.wrong])) return Object.assign(base,{type:"gram_fix",prompt:it.sentence,wrong:it.wrong,fix:String(it.fix||"")}); }
      return null; }).filter(Boolean);
    if(items.length<3) throw {code:"few"};
    round={skill:"G", unit:id, ai:true, stage:u.stage, qs:items, i:0, results:[], combo:0, gained:0, start:Date.now(), answered:false};

    $("#game").innerHTML=`<p>${e&&e.code==="not_granted"?"沒有取得 AI 出題的使用許可。":e&&e.code==="rate_limited"?"使用太頻繁，請稍後再試。":"這次 AI 出題沒有成功，請改用內建題目練習。"}</p><div class="row"><button class="btn primary" data-act="gostart" data-unit="${id}">用內建題目練習</button><button class="btn" data-act="hall">回文法館</button></div>`;
  }
}

/* ============ 單字館 ============ */
function genVocab(unitId,n){
  const v=VOCAB.find(x=>x.id===unitId); if(!v) return [];
  const pool=shuffle(v.w).sort((a,b)=>(P.wrong["V:"+unitId+":"+b[0]]||0)-(P.wrong["V:"+unitId+":"+a[0]]||0)).slice(0,n);
  const others=VOCAB.filter(x=>x.stage===v.stage).flatMap(x=>x.w);
  const distract=(w,k)=>shuffle((v.w.length>=4?v.w:others).filter(x=>x[0]!==w[0])).slice(0,3).map(x=>x[k]);
  return pool.map((w,i)=>{ const id="V:"+unitId+":"+w[0], t=["mc","listen","spell"][Math.floor(Math.random()*3)];
    if(t==="mc"){ const opts=shuffle([w[0]].concat(distract(w,0))); return {id,skill:"V",stage:v.stage,unit:unitId,type:"mc",lead:"選出正確的英文單字：",prompt:w[1],options:opts,answer:opts.indexOf(w[0]),explain:w[0]+"＝"+w[1]}; }
    if(t==="listen"){ const opts=shuffle([w[1]].concat(distract(w,1))); return {id,skill:"V",stage:v.stage,unit:unitId,type:"listen_choice",audio:w[0],prompt:"你聽到的單字是什麼意思？",options:opts,answer:opts.indexOf(w[1]),explain:w[0]+"＝"+w[1]}; }
    return {id,skill:"V",stage:v.stage,unit:unitId,type:"spell",audio:w[0],prompt:w[1],answer:w[0],explain:w[0]+"＝"+w[1]}; });
}

function unitQuestions(u,n){
  const wf=(a,b)=>(P.wrong[b.id]||0)-(P.wrong[a.id]||0);
  if(u.skill==="V") return genVocab(u.id,n);
  if(u.skill==="G") return shuffle(GRAM_QS.filter(q=>q.unit===u.id)).sort(wf).slice(0,n);
  return shuffle(bank().filter(q=>q.skill===u.skill&&q.stage===u.stage)).sort(wf).slice(0,n).map(q=>Object.assign({},q,{unit:u.id}));
}
function startMixedReview(){
  const due=dueUnits(); if(!due.length){ toast("今天沒有到期的複習"); renderMap(); return; }
  const per=due.length>=6?1:Math.ceil(6/due.length);
  let qs=[]; due.forEach(u=>{ qs=qs.concat(unitQuestions(u,per)); });
  qs=shuffle(qs).slice(0,Math.max(6,Math.min(due.length,12)));
  if(!qs.length){ toast("到期單元暫時沒有題目"); return; }
  round={skill:"MIX", review:true, stage:Math.max(...due.map(u=>u.stage)), qs, i:0, results:[], combo:0, gained:0, start:Date.now(), answered:false};
  showTab("play"); renderQ();
}

function checkAch(perfect){
  const got=[]; const give=id=>{ if(!P.ach[id]){ P.ach[id]=Date.now(); got.push(id); } };
  if(P.rounds>=1) give("first");
  if(["L","S","R","W"].every(k=>P.skills[k].r>=1)) give("all4");
  if(perfect) give("perfect");
  if(P.bestCombo>=5) give("combo5");
  if(P.streak>=3) give("streak3");
  if(P.streak>=7) give("streak7");
  const tot=Object.values(P.skills).reduce((s,k)=>s+k.a,0); if(tot>=100) give("q100");
  const h=highestUnlocked(); if(h>=2) give("st2"); if(h>=3) give("st3"); if(h>=5) give("st5");
  if(P.essays>=1) give("essay");
  if(Object.keys(P.cards||{}).length>=5) give("gcard");
  if(masteredCount(P,"G")>=1) give("gmaster");
  if(masteredCount(P,"V")>=1) give("vmaster");
  if(Object.keys(SKILLS).every(k=>masteredCount(P,k)>=1)) give("allmaster");
  if(GRAMMAR.filter(u=>u.level==="國一基礎補強").every(u=>mastery(P.gram[u.id]).lv===3)) give("gjh");
  got.forEach((id,i)=>{ const a=ACH.find(x=>x.id===id); setTimeout(()=>toast(`取得成就 <b>${esc(a.name)}</b>　${esc(a.desc)}`), i*1200); });
}

function wireBankForm(){
  const f=$("#qForm"); if(!f) return;
  const sync=()=>{ const t=$("#fType").value.split("|")[1];
    $("#lAudio").hidden=!(t==="listen_choice"||t==="shadow"||t==="spell");
    $("#lPassage").hidden=t!=="read_choice";
    $("#lOpts").hidden=!(t==="listen_choice"||t==="read_choice");
    $("#lAns").hidden=!(t==="build"||t==="spell"); };
  $("#fType").onchange=sync; sync();
  f.addEventListener("submit",async e=>{ e.preventDefault();
    const [skill,type]=$("#fType").value.split("|"); const stage=+$("#fStage").value;
    const q={skill,type,stage,prompt:$("#fPrompt").value.trim(),explain:$("#fExplain").value.trim(),tags:$("#fTags").value.split(/[、,，]/).map(s=>s.trim()).filter(Boolean),createdAt:Date.now()};
    if(!$("#lAudio").hidden) q.audio=$("#fAudio").value.trim();
    if(type==="read_choice") q.passage=$("#fPassage").value.trim();
    if(type==="spell") q.audio=q.audio||$("#fAns").value.trim();
    if(!$("#lOpts").hidden){ const lines=$("#fOpts").value.split("\n").map(s=>s.trim()).filter(Boolean); if(lines.length<2){ $("#fMsg").textContent="選擇題至少需要 2 個選項。"; return; }
      const sh=shuffle(lines.map((t,i)=>({t,i}))); q.options=sh.map(o=>o.t); q.answer=sh.findIndex(o=>o.i===0); }
    if(!$("#lAns").hidden) q.answer=$("#fAns").value.trim().replace(/\s+/g," ");
    if(!q.prompt || ((type!=="read_choice") && !q.audio && type!=="build") || (type==="build"&&!q.answer)){ $("#fMsg").textContent="請填完必要欄位。"; return; }
    try{ const ref=db.collection("bank").doc(); q.id="X-"+ref.id.slice(0,8); await ref.set(q); $("#fMsg").textContent="已新增："+q.id; f.reset(); sync(); }
    catch(err){ $("#fMsg").textContent="新增失敗，請確認你有編輯權限。"; }
  });
}

  </table></div>
  <p class="muted" style="font-size:.9rem">說明：GEPT 初級對應 CEFR A2。把「國中課綱」放在初級旁邊作為參考，是本規劃的推論，官方文件沒有直接寫「國中＝初級」。優級（C2）不在目前範圍。</p>
  <h3>GEPT 高級測驗架構（LTTC 2025 年報告）</h3>
  <div class="tablebox"><table>
   <tr><th>測驗</th><th>題型</th><th>題數／時間</th></tr>
   <tr><td>聽力</td><td>短篇對話及談話、長篇對話、長篇談話</td><td>40 題／約 55 分鐘</td></tr>
   <tr><td>閱讀</td><td>略讀、精讀</td><td>40 題／70 分鐘</td></tr>
   <tr><td>寫作</td><td>摘要寫作、圖表寫作</td><td>2 題／105 分鐘</td></tr>
   <tr><td>口說</td><td>暖身面談、看圖敘述、申述、訊息交換等</td><td>約 25 分鐘</td></tr>
  </table></div>
  <p>通過標準：聽力、閱讀滿分各 120，總分需達 150 且單項不低於 64；口說、寫作滿分 5 級分，各需 3 級分以上。<span class="muted">（正式報名前請以 LTTC 當年度簡章為準。）</span></p>

  <h2>2. 遊戲化與成就機制</h2>
  <ul>
   <li><b>經驗值（XP）</b>：答對 +10；連續答對 3 題以上每題再 +5；一輪全對 +20；完成 AI 批改短文 +15。每 120 XP 升一級。</li>
   <li><b>區域解鎖</b>：在本區累積到門檻 XP（150／150／200／250）就開啟下一區。門檻只看本區表現，避免一直刷簡單題。</li>
   <li><b>Q 版角色</b>：主角「小傳」與六隻守護獸（單字字字狐、聽力耳耳兔、口說啾啾龍、閱讀書書鴞、寫作墨墨史萊姆、文法格格龜），以及五個區域插圖，皆為本專案原創繪製，未使用任何既有遊戲的角色或圖片。答對時小傳會歡呼，答錯時守護獸會鼓勵再挑戰。</li>
   <li><b>學習者只看到關卡</b>：學習者畫面只顯示區域、單元名稱與圖示，不顯示對應的考試級別、課綱字數、年級或難度，避免產生關卡恐懼；這些對照只列在後台與規劃書。</li>
   <li><b>後台僅管理者可登入</b>：學習者畫面沒有後台與規劃書的入口。原型以 Claude 的擁有者／編輯者權限判斷；APP 版由網址加上 #admin 進入管理者登入頁，以 Firebase 帳號密碼登入，且帳號必須列在 admins 名單；資料庫安全規則也限定只有管理者能讀取全部學習紀錄。</li>
   <li><b>姓名登入</b>：學習者第一次使用時必須填寫姓名，學習紀錄以此姓名登記，後台依姓名排序與顯示。連上雲端時，一個帳號對應一份紀錄（更改姓名需再次確認，進度保留）；未連雲端時，同一台裝置可用不同姓名分別登記。</li>
   <li><b>連續學習天數</b>：每天至少作答 1 題就延續。</li>
   <li><b>全技能精熟機制</b>：單字、聽、說、讀、寫、文法六項都切成「單元」（單字以主題為單元；聽說讀寫以「技能 × 區域」為單元；文法以技能樹項目為單元），全部採同一套精熟標準與間隔複習，詳見第 3 節。</li>
   <li><b>今日複習</b>：冒險地圖上方列出今天到期的單元，按「開始今日複習」會把各單元的題目混在一輪練習，答錯過的題目優先出現。</li>
   <li><b>成就徽章</b>：目前 ${ACH.length} 種，涵蓋起步、全技能、連擊、連續天數、題量與區域里程碑。</li>
   <li><b>後續可加</b>：每週排行榜（可匿名）、班級挑戰、角色外觀兌換、限時活動關卡。</li>
  </ul>

  <h2>3. 精熟機制、小遊戲與文法館</h2>
  <h3>精熟機制（所有技能共用）</h3>
  <ul>
   <li><b>精熟標準</b>：同一個單元最近 10 題至少答對 9 題，而且要在 2 天以上累積，避免一次刷完就算會。最近 5 題以上答對率達 80% 顯示「接近精熟」。答錯後依最近 10 題重新計算，已精熟的單元也可能退回。</li>
   <li><b>間隔複習</b>：一輪中該單元全對，下次複習依序隔 1、2、4、7、14 天；只要答錯就改成隔天複習，答錯的題目優先出現。</li>
   <li><b>避免背答案</b>：單字每輪從主題中隨機挑字，並隨機組成「看中文選英文」「聽音選意思」「聽寫拼字」三種題型；聽說讀寫與文法可按「AI 新題」依同一單元出 5 題新題（未經教師審稿）。</li>
   <li><b>看得到進度</b>：每項技能與每個單元都有精熟標示與進度條；成就頁有「精熟總覽」；新增「單字達人」「全面精熟」徽章；後台顯示每位學習者的精熟單元數、各單元狀態與下次複習日期。</li>
   <li><b>目前限制</b>：聽說讀寫在較高區域的內建題目較少（部分區域不足 5 題，會用前一區題目補足），短期內需靠 AI 新題補充；口說的自評結果也會計入精熟，正式版宜改由語音辨識或教師評分。</li>
  </ul>
  <h3>小遊戲</h3>
  <ul>
   <li><b>單字館</b>：${VOCAB.length} 個主題、每個主題 ${VOCAB[0].w.length} 個字，有單字卡（可朗讀）與練習。示範字表為英文傳說自編，正式版需對照 108 課綱參考字彙表（國小 300、國中 1,200 字詞）。</li>
   <li><b>聽力</b>：瀏覽器朗讀英文，選出意思；可慢速重播。對應高級題型時改為長篇談話與主旨題。</li>
   <li><b>口說</b>：聽示範後跟讀。若瀏覽器允許麥克風，系統比對字詞吻合度（≥80% 算通過）；不允許時改用自評，後台會一併計入，請把口說正確率視為參考值。</li>
   <li><b>閱讀</b>：標示、短文、公告到學術文章，題目涵蓋細節、主旨與推論。</li>
   <li><b>寫作</b>：字卡造句、聽寫拼字，加上 AI 短文批改（練習用，不等於官方評分）。高級的摘要寫作與圖表寫作，正式版需要另外設計長篇任務。</li>
  </ul>

  <h3>文法館（核心架構：國中英文文法技能樹題庫主檔 v1）</h3>
  <ul>
   <li>文法模組以「108課綱_國中英文文法技能樹_題庫主檔_v1.xlsx」為核心：官方原列項目 ${GOFFICIAL.length} 條、文法技能樹 ${GRAMMAR.filter(u=>u.src==="主檔").length} 項技能（國一基礎補強 ${GRAMMAR.filter(u=>u.level==="國一基礎補強").length}、國二同步教學 ${GRAMMAR.filter(u=>u.level==="國二同步教學").length}、國三會考統整 ${GRAMMAR.filter(u=>u.level==="國三會考統整").length}）、診斷題 ${GDIAG.length} 題。技能 ID、官方 ID、類別、細項、階段、階層、優先度與題目文字皆照主檔，未改寫。</li>
   <li>計分規則：主檔審核狀態為「示範題（精準對應）」的 ${GRAM_QS.filter(q=>q.src==="主檔").length} 題計入精熟度；標為「共通概念示範／需改為單元專屬題」的 ${GDIAG.filter(d=>d.review!=="示範題（精準對應）").length} 題依主檔警語不計分，保留在後台「文法題庫審核」待改編。</li>
   <li>英文傳說補充：原先自編的 ${GRAM_QS.filter(q=>q.src==="補充").length} 題與 ${GRAMMAR.filter(u=>u.card&&u.src==="主檔").length} 張短教學小卡已對應到技能 ID，標示為「補充（非主檔）」；分詞構句、倒裝、假設語氣、強調句等 ${GRAMMAR.filter(u=>u.src!=="主檔").length} 項超出國中範圍，列為「英檢進階（英文傳說自編）」並依區域解鎖。</li>
   <li><b>61 項技能補題</b>：主檔沒有計分題的 61 項技能，已匯入「單元專屬題庫 AI 初稿 v1」共 ${GAIQ.length} 題（每項 5 題），計入精熟度，但標示為「AI 初稿／待教師審稿」，審稿清單列在後台。</li>
   <li><b>精熟標準</b>：同一項技能最近 10 題至少答對 9 題（90%），且在 2 天以上累積；最近 5 題以上答對率達 80% 顯示「接近精熟」；之後答錯會依最近 10 題重新計算。</li>
   <li><b>間隔複習</b>：一輪中該技能全對，複習間隔依序拉長為 1、2、4、7、14 天；有任何答錯就回到隔天。到期技能出現在「今日複習」，答錯過的題目優先出題。題目不足的技能可用「AI 新題」練習（未經教師審稿）。</li>
   <li><b>後台</b>：每位學習者的精熟技能數、各技能精熟度與下次複習日、全體平均精熟數，以及主檔審核狀態與題目覆蓋率。</li>
  </ul>

  <h2>4. 題庫資料結構</h2>
  <p>每一題是一筆獨立資料，新增題目不用改程式。後台表單寫入雲端題庫，學習者端會自動合併內建題與新增題。</p>
  <pre>{
  "id": "L3-01",            // 題號：技能+區域+流水號
  "skill": "L",             // V 單字 / L 聽 / S 說 / R 讀 / W 寫 / G 文法
  "stage": 3,               // 區域 1–5
  "type": "listen_choice",  // listen_choice / shadow / read_choice / build / spell
  "audio": "Thank you for calling...",  // 語音內容（聽力、口說、拼字）
  "passage": "",            // 閱讀短文
  "prompt": "下列哪個時間可以到診所看診？",
  "options": ["...", "..."],
  "answer": 1,              // 選擇題為索引；造句、拼字為正確英文
  "explain": "開放時間為週一到週五...",
  "tags": ["醫療", "電話留言"]  // 課綱主題、文法點、GEPT 題型
}</pre>
  <p class="muted" style="font-size:.9rem">原型中的題目都是自編的示範題，不是全民英檢官方試題。正式上線前，題目需由英文教師審稿，並標記對應的課綱學習內容代碼。</p>

  <h2>5. 後台學習狀況指標</h2>
  <div class="tablebox"><table>
   <tr><th>指標</th><th>分子</th><th>分母</th><th>期間／備註</th></tr>
   <tr><td>7 日活躍率</td><td>最近 7 天有作答的學習者數</td><td>全部學習者數</td><td>以最後作答時間判斷</td></tr>
   <tr><td>技能正確率（個人）</td><td>該技能答對題數</td><td>該技能作答題數</td><td>累計；作答 0 題顯示「—」</td></tr>
   <tr><td>技能平均正確率（全體）</td><td>各人技能正確率加總</td><td>有作答該技能的人數</td><td>未作答者不計入</td></tr>
   <tr><td>需要關注</td><td colspan="2">超過 7 天未學習，或任一技能作答 ≥10 題且正確率 &lt; 60%</td><td>門檻可再調整</td></tr>
   <tr><td>常錯題</td><td colspan="2">各題累計答錯次數（答對會遞減）</td><td>每人保留前 30 題</td></tr>
   <tr><td>區域分布</td><td colspan="2">各區域目前人數</td><td>以已解鎖的最高區域計</td></tr>
  </table></div>
  <p class="muted" style="font-size:.9rem">口說正確率包含自評結果，與聽讀寫的客觀計分口徑不同，解讀時請分開看。學習分鐘數以每輪開始到結束的時間估算。</p>

  <h2>6. 原型限制與上架路線</h2>
  <ul>
   <li>APP 版（可安裝的網頁 APP，PWA）：學習者用姓名登入；設定雲端資料庫（Firebase）後，進度會同步到後台；未設定或離線時只存在本機。AI 新題與 AI 短文批改需要另外設定 AI 服務，APP 版目前先關閉。</li>
   <li>語音使用瀏覽器內建朗讀，音質因裝置而異；正式版建議改用真人錄音或專業語音合成。</li>
   <li>正式上架需要：程式碼庫、帳號系統（學生／老師／管理者）、資料庫、題庫審稿流程、個資保護（未成年學習者需家長同意）、App Store／Google Play 或網頁部署。</li>
  </ul>

/* ============ 管理者登入（Firebase 版） ============ */
function adminLoginHTML(){
  if(APP_MODE!=="firebase") return "";
  if(fbInfo&&!fbInfo.anonymous) return `<p class="muted" style="font-size:.9rem">目前登入：${esc(fbInfo.email)}（這個帳號不是管理者）</p><button class="btn" id="adminOut" type="button">登出</button>`;
  return `<h3 style="margin-top:12px;font-size:1rem">管理者登入</h3>
   <form id="adminLogin" class="formgrid" style="margin-top:8px">
     <label class="full">電子郵件<input type="email" id="aEmail" autocomplete="username"></label>
     <label class="full">密碼<input type="password" id="aPw" autocomplete="current-password"></label>
     <div class="full row"><button class="btn primary" type="submit">登入後台</button><span class="muted" id="aMsg" style="font-size:.88rem"></span></div>
   </form><p class="muted" style="font-size:.85rem">提醒：管理者登入後，這台裝置原本的學習紀錄不會同步。建議老師用自己的裝置或瀏覽器登入。</p>`;
}
document.addEventListener("submit",async e=>{ if(e.target.id!=="adminLogin") return; e.preventDefault();
  const m=$("#aMsg"); m.textContent="登入中…";
  try{ await adminSignIn($("#aEmail").value.trim(),$("#aPw").value); }catch(err){ m.textContent="登入失敗，請確認帳號密碼。"; } });
document.addEventListener("click",e=>{ if(e.target.id==="adminOut") adminSignOut(); });

/* ============ 啟動 ============ */
$("#loginHero").innerHTML=heroSVG("happy",120); $("#mapHero").innerHTML=heroSVG("happy",110);
renderHeader(); renderPlan(); applyRole(); showTab(ADMIN_ROUTE?"admin":"map");
if("serviceWorker" in navigator && location.protocol.startsWith("http")) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
(async()=>{
  try{
    const C=window.claude;
    if(C&&C.use){ APP_MODE="claude";
      [db,user,sample]=await Promise.all([C.use("db"),C.use("user"),C.use("sample")]);
      if(user){ try{ uid=await user.id(); isAdmin=!!(await user.canEdit()); }catch(e){} }
    } else if(window.EL_FIREBASE && window.EL_FIREBASE.apiKey){
      try{ fbInfo=await initFirebase(window.EL_FIREBASE); APP_MODE="firebase"; db=fbInfo.db; uid=fbInfo.anonymous?fbInfo.uid:null; isAdmin=fbInfo.isAdmin; } // 老師帳號不寫入學習紀錄
      catch(e){ console.warn("Firebase 連線失敗",e); setSync("雲端連線失敗，學習紀錄先存在這台裝置"); if(!$("#tab-admin").hidden) renderAdmin(); return; }
    } else { setSync(); return; }
    if(db&&uid){
      try{ const snap=await db.doc("learners/"+uid).get(); if(snap.exists){ const remote=snap.data(); const rn=cleanName(remote.name||remote.nickname);
        // 雲端紀錄綁定帳號：已登記姓名時以雲端紀錄為準
        if(rn && (P.name!==rn || (remote.xp||0)>=(P.xp||0))){ P=Object.assign(freshProfile(),remote,{name:rn}); delete P.nickname; } } }catch(e){}
      try{ db.collection("bank").onSnapshot(s=>{ bankExtra=s.docs.map(d=>d.data()).filter(q=>q&&q.skill&&q.type&&q.stage); if(!$("#tab-admin").hidden) renderAdmin(); }, ()=>{}); }catch(e){}
    } else if(db){ try{ db.collection("bank").onSnapshot(s=>{ bankExtra=s.docs.map(d=>d.data()).filter(q=>q&&q.skill&&q.type&&q.stage); },()=>{}); }catch(e){} }
    saveLocal(); renderHeader(); applyRole();
    if(!$("#tab-login").hidden || !$("#tab-map").hidden) showTab("map");

    if(!$("#tab-admin").hidden) renderAdmin();
  }catch(e){ setSync(); }
})();
